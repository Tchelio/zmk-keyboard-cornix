manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tchelio
      url-base: https://github.com/Tchelio
    - name: hitsmaxft
      url-base: https://github.com/hitsmaxft
    - name: englmaxi
      url-base: https://github.com/englmaxi
    - name: urob
      url-base: https://github.com/urob
    - name: janpfischer
      url-base: https://github.com/janpfischer
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # ZMK의 app/west.yml이 zmkfirmware/zmk-studio-messages를 특정 커밋으로
    # 고정하는데, 그걸 내 포크로 덮어쓴다. west는 프로젝트를 "이름"으로
    # 식별하고 같은 이름이 여러 매니페스트에 있으면 "가장 먼저 나온 정의"를
    # 쓰는데, 최상위 매니페스트(= 이 파일)가 import보다 먼저 처리되므로
    # 여기 적은 것이 이긴다.
    #
    # 목적: Studio RPC로 활성 레이어를 호스트에 알리기 위해 core.proto에
    # 필드를 추가함(get_active_layers / active_layers_changed). ZMK 엔진은
    # 공식 main 그대로 두고 proto만 갈아끼우는 구성 - ZMK가 proto 파일을
    # CMakeLists에 이름으로 나열해서 새 파일은 못 넣기 때문에, 새 서브시스템
    # 대신 기존 core.proto에 필드를 얹었다.
    # 경위: vault의 keyboard-레이어상태-호스트전달채널-재설계 참조.
    #
    # path는 ZMK가 쓰는 것과 동일하게 유지(ZEPHYR_ZMK_STUDIO_MESSAGES_MODULE_DIR).
    - name: zmk-studio-messages
      remote: tchelio
      revision: main
      path: modules/msgs/zmk-studio-messages

    # ZMK 엔진도 포크로 덮어쓴다(2026-08-30). 원래는 공식 main을 그대로 썼다.
    #
    # 이유: app/src/studio/rpc.c의 rpc_tx_buffer_write()가 TX 링버퍼가 꽉 차면
    # 양보도 포기도 없이 무한히 돈다. 그런데 알림은 이벤트를 올린 스레드의
    # 컨텍스트에서 전송되므로(studio_rpc_listener_cb), src/layer_state_rpc.c처럼
    # zmk_layer_state_changed에 붙은 리스너에서 알림을 올리면 **키 입력을
    # 처리하는 스레드가 거기서 멈춘다** - 전원을 껐다 켜야 풀린다.
    #
    # 실제로 USB<->BLE 전환 때마다 재현됐다: 엔드포인트가 옮겨가면 이전 전송을
    # 아무도 안 비우는 구간이 생기고, 그때 레이어를 바꾸면 먹통이 됐다.
    # 호스트 앱을 아예 안 켠 경우에도 같다.
    #
    # 패치: 재시도에 시간 제한 + k_msleep(1)로 CPU 양보. 겸사겸사
    # send_response()가 인코딩 실패 시 뮤텍스를 안 풀고 나가던 것도 고침
    # (원래는 도달 불가였는데 위 변경으로 도달 가능해진다).
    #
    # 복구 절차와 업스트림 반영 여부는 vault의
    # keyboard-restore-zmk-studio-rpc-무한루프 참조.
    - name: zmk
      remote: tchelio
      revision: main
      clone-depth: 1
      import:
        file: app/west.yml
    - name: zmk-helpers
      remote: urob
      revision: main
      clone-depth: 1
    #- name: zmk-rgbled-widget
    #  remote: hitsmaxft
    #  revision: main
    #  clone-depth: 1
    - name: zmk-dongle-display
      remote: englmaxi
      revision: main
      clone-depth: 1
    # DYA Studio extensions. ZMK Studio remains enabled as the shared RPC transport.
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
      clone-depth: 1
    #- name: zmk-dongle-screen
    #  remote: janpfischer
    #  revision: main
    #  clone-depth: 1
  self:
    path: config
