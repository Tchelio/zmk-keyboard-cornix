# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: cornix_dongle_adapter cornix_dongle_eyelash dongle_display
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: cornix_dongle_nosd
  # dongle screen not yet supports zephyr4
  # - board: seeeduino_xiao_ble
  #   shield: cornix_dongle_adapter dongle_screen
  #   snippet: studio-rpc-usb-uart
  #   artifact-name: cornix_dongle_zds_see
  # - board: nice_nano
  #   shield: cornix_dongle_adapter dongle_screen
  #   snippet: studio-rpc-usb-uart
  #   artifact-name: cornix_dongle_zds_nano
  - board: cornix_left//zmk
    # shield: cornix_indicator
    artifact-name: cornix_left_default_nosd

  # ZMK Studio 테스트용 빌드 (scylla-zmk-config remapper 포팅 1단계).
  # 기존 cornix_left_default_nosd는 그대로 두고 별도 아티팩트로 추가함.
  # STUDIO_LOCKING=n은 키맵에 &studio_unlock 바인딩을 새로 넣지 않고
  # 바로 테스트하기 위한 임시 조치 — 나중에 정식으로 쓸 거면 잠금 다시 켜고
  # 언락 키를 키맵에 추가하는 걸 권장.
  - board: cornix_left//zmk
    snippet: studio-rpc-usb-uart nrf52840-nosd
    # CONFIG_BT_CTLR_PHY_2M=n (2026-09-04): 윈도우에서 재부팅 후 BLE 재연결이
    # 안 되던 문제. "페어링됨"으로만 남고 실제로 안 붙었고, 양쪽 본딩을 지우고
    # 다시 맺어야만 됐다. 맥·아이패드는 멀쩡했고 같은 PC에 붙인 다른(비ZMK)
    # 블투 키보드도 멀쩡해서 호스트 문제로만 보기 어려웠다.
    # ZMK 공식 트러블슈팅이 정확히 이 경우를 다룬다 - "특정 무선 칩셋 펌웨어
    # 버전에서, 특히 윈도우에서 2M PHY를 끄면 페어링/연결에 도움이 된다".
    # 해당 PC의 어댑터는 UGREEN CM591(Actions ATS2851, LMP 12.513).
    # 대가는 링크 속도 2M->1M 뿐이고 키보드 트래픽엔 체감이 없다. 오히려
    # 거리·잡음 내성은 1M이 낫다. 효과 없으면 다음 후보는
    # CONFIG_ZMK_BLE_PASSKEY_ENTRY=y (지금 =n).
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_BT_CTLR_PHY_2M=n
    artifact-name: cornix_left_studio

  - board: cornix_ph_left//zmk
    # shield: cornix_indicator
    artifact-name: cornix_left_for_dongle_nosd

  - board: cornix_right//zmk
    # shield: cornix_indicator
    artifact-name: cornix_right_nosd

  - board: cornix_right//zmk
    shield: settings_reset
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: cornix_reset

  # 좌측 보드로 빌드한 설정 초기화 (2026-09-04 추가).
  #
  # 위 cornix_reset(우측 보드)도 왼쪽에 올리면 동작하기는 한다 - 좌우가 같은
  # nRF52840이고 settings_reset은 설정 파티션만 지우기 때문. 이건 보드가
  # 맞는 것을 쓰고 싶을 때를 위한 것이다.
  #
  # 스플릿은 좌우가 서로를 본딩해 기억하므로, 좌우가 안 붙으면 **양쪽 다**
  # 리셋한 뒤 양쪽에 정상 펌웨어를 다시 올려야 한다. 한쪽만 지우면 나머지가
  # 옛 짝을 계속 기억해 어긋난 채로 남는다. 왼쪽 설정이 지워지면 호스트 BT
  # 프로필(맥/아이패드/윈도우)도 같이 날아가므로 재페어링이 필요하다.
  - board: cornix_left//zmk
    shield: settings_reset
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: cornix_left_reset

  - board: nice_nano//zmk
    shield: settings_reset
    snippet: studio-rpc-usb-uart nrf52840-nosd
    artifact-name: reset_nicenano_nosd
